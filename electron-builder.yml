appId: com.desktoplife.simulator
productName: Desktop Life Simulator
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# UNSIGNED under ADR-028 — the v0.2 signing exception.
#
# Declared rather than merely absent (ADR-028 §4): an unsigned build must be
# distinguishable from one whose signing configuration silently broke, and a
# missing field cannot tell you which of the two you are looking at.
#
# ADR-025 §3 requires a publisher signature and is NOT being relaxed as a
# destination. What could not be met is the schedule: a signature needs an
# OV/EV certificate or a cloud signing service, which is procurement rather
# than code. Artifact integrity is unaffected and stays fatal — the update feed
# carries a SHA-512 per artifact, and a mismatch discards the download before
# anything on disk is touched.
#
# The exception EXPIRES AT 0.3.0 and `tests/signing-exception.test.ts` is what
# enforces it: add any signing key below and that test goes quiet by itself.
# Never self-sign (ADR-028 §Alternatives C) — it removes no warning, proves no
# identity, and turns an honest absence into something that looks like
# assurance.

# Windows-only in v0.1. macOS/Linux overlay semantics differ enough that
# pretending otherwise would compromise the Windows implementation
# (VISION.md §5.1). Revisit no earlier than v0.3.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false # never destroy player saves on uninstall

# v0.1 shipped `publish: null` — "an updater that can restart the app is a way
# to lose player data, so it ships only after save integrity is proven in
# phase-07" (PLAN.md §3). That proof landed, and phase-15 built the updater on
# top of it, so the channel opens here.
#
# GitHub Releases: electron-updater reads this provider natively, so no custom
# feed format and no infrastructure of our own. The generated `latest.yml`
# carries a SHA-512 per artifact, which is the integrity check ADR-028 §2 keeps
# fatal now that the publisher signature is deferred.
publish:
  provider: github
